[defaults]
roles_path = ./roles
# Run more hosts concurrently (default is 5). Set above the host count so every host runs in parallel.
forks = 20
# NOTE: keep the default 'linear' strategy. The wireguard role builds each host's wg0.conf from
# every other host's wg_public_key fact, so all hosts must finish key generation (per-task barrier)
# before any host templates its config. 'free' would let a fast host write an incomplete peer list.
# Gather facts faster and cache them so reruns skip re-gathering.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 7200

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
